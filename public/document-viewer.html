<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Document Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .toolbar button {
      background: transparent;
      border: none;
      color: #cbd5e1;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    .toolbar .title {
      flex: 1;
      font-size: 1rem;
      font-weight: 500;
      margin-left: 0.5rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toolbar .zoom-display {
      font-size: 0.85rem;
      color: #94a3b8;
      min-width: 3rem;
      text-align: center;
    }

    /* Viewer container */
    .viewer {
      height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      overflow: auto;
    }
    .viewer.fullscreen {
      height: 100vh;
    }
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
    }
    canvas {
      border-radius: 0.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      height: auto !important;
    }

    /* Page controls */
    .page-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1.25rem;
      border-radius: 2rem;
      margin-bottom: 1rem;
    }
    .page-controls button {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.25rem;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-controls button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }
    .page-controls button:disabled {
      opacity: 0.3;
      cursor: default;
    }
    .page-controls span {
      font-size: 0.85rem;
      min-width: 5rem;
      text-align: center;
    }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      z-index: 50;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(239, 68, 68, 0.9);
      color: white;
      padding: 1rem 2rem;
      border-radius: 1rem;
      backdrop-filter: blur(12px);
    }

    /* Fallback iframe (Google Drive embed) */
    #fallback-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: white; /* most embeds look better on white */
    }

    /* Hide scrollbars (optional) */
    .viewer::-webkit-scrollbar { width: 8px; }
    .viewer::-webkit-scrollbar-track { background: #1e293b; }
    .viewer::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

    /* Anti-piracy: disable text selection (except inputs) */
    * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }
    input, textarea {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }
  </style>
</head>
<body>

  <!-- Toolbar -->
  <div class="toolbar">
    <button onclick="history.back()" title="Back"><i class="fas fa-arrow-left"></i></button>
    <span class="title">Document Viewer</span>
    <button id="zoom-out-btn" title="Zoom Out"><i class="fas fa-search-minus"></i></button>
    <span class="zoom-display" id="zoom-level">100%</span>
    <button id="zoom-in-btn" title="Zoom In"><i class="fas fa-search-plus"></i></button>
    <button id="fullscreen-btn" title="Fullscreen"><i class="fas fa-expand"></i></button>
    <button id="download-btn" title="Download"><i class="fas fa-download"></i></button>
    <button id="print-btn" title="Print"><i class="fas fa-print"></i></button>
  </div>

  <!-- Viewer area -->
  <div class="viewer" id="viewer">
    <div id="pdf-container"></div>
    <iframe id="fallback-iframe" allowfullscreen sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
  </div>
  <div class="error-message hidden" id="error-msg">Failed to load document.</div>

<script>
  // ========== DISABLE RIGHT-CLICK ==========
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ========== GLOBALS ==========
  let pdfDoc = null;
  let currentPage = 1;
  let currentScale = 1.0;
  const pdfContainer = document.getElementById('pdf-container');
  const loadingOverlay = document.getElementById('loading-overlay');
  const errorMsg = document.getElementById('error-msg');
  const zoomLevelSpan = document.getElementById('zoom-level');
  const viewerDiv = document.getElementById('viewer');
  const fallbackIframe = document.getElementById('fallback-iframe');

  // ========== UTILS ==========
  function getQueryParam(p) {
    return new URLSearchParams(window.location.search).get(p);
  }

  function extractDriveFileId(url) {
    const patterns = [
      /\/d\/([a-zA-Z0-9_-]+)/,
      /\/file\/d\/([a-zA-Z0-9_-]+)/,
      /[?&]id=([a-zA-Z0-9_-]+)/
    ];
    for (const p of patterns) {
      const match = url.match(p);
      if (match) return match[1];
    }
    return null;
  }

  function isGoogleDriveUrl(url) {
    return url.includes('drive.google.com');
  }

  /**
   * Downloads a Google Drive file, automatically handling virus‑scan confirmation.
   * Returns a Blob (PDF) on success, or throws an error if still blocked.
   */
  async function downloadDriveFile(fileId) {
    console.log('Attempting to download Drive file:', fileId);

    // First attempt: direct download
    let response = await fetch(`https://drive.google.com/uc?export=download&id=${fileId}`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const contentType = response.headers.get('content-type') || '';
    if (contentType.includes('text/html')) {
      const html = await response.text();
      // Try to extract the virus-scan confirmation code
      const confirmMatch = html.match(/confirm=([a-zA-Z0-9_-]+)/);
      if (confirmMatch) {
        const confirmCode = confirmMatch[1];
        console.log('Virus scan confirmation found, retrying with code:', confirmCode);
        // Retry with confirmation code and cookies that might be needed
        response = await fetch(`https://drive.google.com/uc?export=download&confirm=${confirmCode}&id=${fileId}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        // Check again if we got HTML (e.g., login page)
        const newContentType = response.headers.get('content-type') || '';
        if (newContentType.includes('text/html')) {
          // Still HTML — file is not public or requires login
          throw new Error('Drive file not publicly accessible or requires login');
        }
      } else {
        // No confirmation code — likely a login page
        throw new Error('Drive file not publicly accessible or requires login');
      }
    }

    return await response.blob();
  }

  // ========== LOAD PDF ==========
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function loadDocument() {
    const originalUrl = getQueryParam('url');
    if (!originalUrl) {
      showError('No document URL provided.');
      return;
    }

    loadingOverlay.classList.remove('hidden');
    errorMsg.classList.add('hidden');

    try {
      let pdfSource;

      if (isGoogleDriveUrl(originalUrl)) {
        const fileId = extractDriveFileId(originalUrl);
        if (!fileId) throw new Error('Invalid Google Drive link');

        try {
          const blob = await downloadDriveFile(fileId);
          pdfSource = URL.createObjectURL(blob);
        } catch (downloadErr) {
          console.warn('Direct download failed, falling back to Google Drive embed preview:', downloadErr.message);
          // Fallback: embed the Google Drive preview (user will see Drive's own controls)
          fallbackIframe.src = `https://drive.google.com/file/d/${fileId}/preview`;
          fallbackIframe.style.display = 'block';
          pdfContainer.style.display = 'none';
          loadingOverlay.classList.add('hidden');
          // Disable PDF-only controls
          document.getElementById('zoom-in-btn').disabled = true;
          document.getElementById('zoom-out-btn').disabled = true;
          zoomLevelSpan.textContent = '—';
          return;
        }
      } else if (originalUrl.toLowerCase().endsWith('.pdf')) {
        // Direct PDF link
        pdfSource = originalUrl;
      } else {
        // Non-PDF file: show in iframe
        fallbackIframe.src = originalUrl;
        fallbackIframe.style.display = 'block';
        pdfContainer.style.display = 'none';
        loadingOverlay.classList.add('hidden');
        document.getElementById('zoom-in-btn').disabled = true;
        document.getElementById('zoom-out-btn').disabled = true;
        zoomLevelSpan.textContent = '—';
        return;
      }

      // Load PDF with PDF.js
      pdfDoc = await pdfjsLib.getDocument(pdfSource).promise;
      currentPage = 1;
      currentScale = 1.0;
      pdfContainer.style.display = 'flex';
      fallbackIframe.style.display = 'none';
      // Re-enable zoom controls (in case they were disabled before)
      document.getElementById('zoom-in-btn').disabled = false;
      document.getElementById('zoom-out-btn').disabled = false;
      renderPage(currentPage);
      loadingOverlay.classList.add('hidden');

    } catch (err) {
      console.error(err);
      loadingOverlay.classList.add('hidden');
      showError('Failed to load document. It may be unavailable or require access permissions.');
    }
  }

  function renderPage(num) {
    if (!pdfDoc) return;
    pdfDoc.getPage(num).then(page => {
      const viewport = page.getViewport({ scale: currentScale });
      const canvas = document.createElement('canvas');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      const ctx = canvas.getContext('2d');
      const renderContext = { canvasContext: ctx, viewport: viewport };

      // Clear previous canvas
      pdfContainer.innerHTML = '';
      pdfContainer.appendChild(canvas);

      // Build page controls
      const controlsDiv = document.createElement('div');
      controlsDiv.className = 'page-controls';
      
      const prevBtn = document.createElement('button');
      prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
      prevBtn.disabled = (num <= 1);
      prevBtn.addEventListener('click', () => {
        if (currentPage <= 1) return;
        currentPage--;
        renderPage(currentPage);
      });

      const nextBtn = document.createElement('button');
      nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
      nextBtn.disabled = (num >= pdfDoc.numPages);
      nextBtn.addEventListener('click', () => {
        if (currentPage >= pdfDoc.numPages) return;
        currentPage++;
        renderPage(currentPage);
      });

      const pageSpan = document.createElement('span');
      pageSpan.textContent = `Page ${num} of ${pdfDoc.numPages}`;

      controlsDiv.appendChild(prevBtn);
      controlsDiv.appendChild(pageSpan);
      controlsDiv.appendChild(nextBtn);

      pdfContainer.appendChild(controlsDiv);

      // Render the page
      page.render(renderContext);
      zoomLevelSpan.textContent = Math.round(currentScale * 100) + '%';
    });
  }

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.remove('hidden');
  }

  // ========== TOOLBAR ACTIONS ==========
  document.getElementById('zoom-in-btn').addEventListener('click', () => {
    if (!pdfDoc) return;
    currentScale = Math.min(3.0, currentScale + 0.25);
    renderPage(currentPage);
  });

  document.getElementById('zoom-out-btn').addEventListener('click', () => {
    if (!pdfDoc) return;
    currentScale = Math.max(0.5, currentScale - 0.25);
    renderPage(currentPage);
  });

  document.getElementById('fullscreen-btn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      viewerDiv.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    const originalUrl = getQueryParam('url');
    if (originalUrl) {
      const a = document.createElement('a');
      a.href = originalUrl;
      a.download = '';
      a.click();
    }
  });

  document.getElementById('print-btn').addEventListener('click', () => {
    const originalUrl = getQueryParam('url');
    if (originalUrl) {
      // Open in a new tab and trigger print (works for PDF/embeds)
      const printWindow = window.open(originalUrl, '_blank');
      if (printWindow) {
        printWindow.addEventListener('load', () => {
          printWindow.print();
        });
      }
    }
  });

  // ========== START ==========
  window.addEventListener('load', loadDocument);
</script>
</body>
  </html>
